<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIMMYT Asia Procurement Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --navy:#0c3554;--ink:#12324c;--muted:#6b8298;--line:#d7e6ee;--bg:#eef5f8;--card:#fff;
  --teal:#0aa3b8;--cyan:#0798d4;--green:#4fa82a;--orange:#f59b22;--red:#e5484d;--grey:#8a9bab;
  --shadow:0 8px 24px rgba(12,53,84,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",Arial,sans-serif;font-size:14px}
button,input,select{font-family:inherit}
.app{display:flex;min-height:100vh}
.app.hidden{display:none}
.password-overlay{position:fixed;inset:0;background:rgba(8,29,39,.72);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.password-overlay.hidden{display:none}
.password-modal{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(7,28,39,.3);padding:24px 22px 20px}
.password-modal h2{margin:8px 0 14px;color:var(--navy);font-size:28px;letter-spacing:-.04em}
.login-label{display:block;margin-top:12px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.password-field{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;margin-top:6px;outline:none}
.password-field:focus{border-color:#0aa3b8;box-shadow:0 0 0 3px rgba(10,163,184,.12)}
.password-actions{display:flex;justify-content:flex-end;margin-top:16px}
.password-error{min-height:18px;margin-top:10px;color:#c33842;font-size:12px;font-weight:700}
.sidebar{width:232px;flex:none;background:linear-gradient(180deg,#0a3344 0%,#0c3d4d 55%,#0a2f3e 100%);color:#d7e8ee;position:sticky;top:0;height:100vh;padding:22px 14px 18px;display:flex;flex-direction:column;z-index:20}
.brand{text-align:center;margin:2px 0 26px}
.logo{display:block;width:min(190px,100%);height:auto;margin:0 auto 8px}
.brand small{display:block;margin-top:4px;letter-spacing:.22em;font-size:9px;color:#8bb8c2}
.wheat{margin:auto 0 0 16px;opacity:.16;flex:none}
.nav{display:grid;gap:6px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;font-size:13.5px;font-weight:600;color:#cfe0e6}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.active{background:linear-gradient(90deg,#0e8696,#0e7d8d);color:#fff;box-shadow:inset 3px 0 0 #35d6e6}
.nav button:focus-visible{outline:2px solid #7fe0ee;outline-offset:2px}
.nav .count{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:10.5px;padding:1px 7px;font-weight:700}
.side-foot{margin-top:10px;font-size:11px;color:#8bb8c2;line-height:1.5}
.main{flex:1;min-width:0;padding:22px 26px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.eyebrow{color:#0a8ea3;font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:10px}
h1{margin:6px 0 4px;color:var(--navy);font-size:28px;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.tools label,.filters label{display:grid;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=date],input[type=text],input[type=number],input[type=search],select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 10px;font-size:13px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,163,184,.14)}
.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:#0e7d8d;border-color:#0e7d8d;color:#fff}
.btn.primary:hover{background:#0b6b79}
.btn:disabled{opacity:.55;cursor:wait}
.btn.small{padding:5px 9px;font-size:12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:16px 0 0}
.filters select{max-width:210px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-top:16px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow);border-left:4px solid var(--teal);display:block}
.kpi:hover{border-color:var(--teal)}
.kpi:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.kpi span{display:block;color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font-size:25px;color:var(--navy);margin:5px 0 2px;letter-spacing:-.02em}
.kpi small{color:var(--muted);font-size:11.5px}
.kpi.orange{border-left-color:var(--orange)}.kpi.red{border-left-color:var(--red)}.kpi.green{border-left-color:var(--green)}.kpi.navy{border-left-color:var(--navy)}
.kpi.red b{color:#c2333a}.kpi.orange b{color:#b76a05}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);min-width:0}
.panel.wide{grid-column:1/-1}
.panel h2{margin:0;font-size:14.5px;color:var(--navy)}
.panel .hint{color:var(--muted);font-size:12px;margin:3px 0 10px}
.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.cv{position:relative;height:270px}
.cv.tall{height:330px}
.tablewrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;background:#f6fafc;position:sticky;top:0}
th.sortable{cursor:pointer}th.sortable:hover{color:var(--navy)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:#f3f9fb}
td.wrap{white-space:normal;min-width:200px;max-width:340px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#e8eff3;color:#3d5a70}
.pill.green{background:#e3f4d9;color:#2f6d14}.pill.orange{background:#fdeed5;color:#96560a}.pill.red{background:#fde0e1;color:#a3252b}.pill.blue{background:#dcf0fa;color:#0a618a}.pill.grey{background:#e8eff3;color:#566b7c}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--navy);font-size:15px;margin-bottom:5px}
.alerts{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:10px;background:#f6fafc;border:1px solid var(--line);font-size:13px}
.alerts li i{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{all:unset;cursor:pointer;padding:8px 16px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:#0e7d8d;color:#fff}
.stage{display:inline-block;min-width:104px;padding:4px 8px;border-radius:8px;font-size:11.5px;line-height:1.35;border:1px solid transparent}
.stage b{display:block;font-size:11.5px}
.stage.done{background:#e3f4d9;color:#2f6d14}.stage.upcoming{background:#eef3f6;color:#566b7c}.stage.due{background:#fdeed5;color:#96560a;border-color:#f5c887}.stage.overdue{background:#fde0e1;color:#a3252b;border-color:#f1a7ab}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.55}
dialog{border:none;border-radius:16px;padding:20px 22px;width:min(1080px,94vw);max-height:88vh;box-shadow:0 24px 60px rgba(7,28,39,.3);color:var(--ink)}
dialog::backdrop{background:rgba(8,29,39,.6)}
dialog h2{margin:0 0 4px;color:var(--navy);font-size:19px}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 18px;margin-top:12px}
.dl div{border-bottom:1px solid var(--line);padding:5px 0}
.dl span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.loader{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted);font-size:15px;font-weight:600}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--line);border-top-color:#0e7d8d;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}}
.toast{position:fixed;right:20px;bottom:20px;background:#0c3554;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;max-width:420px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:none}
@media (max-width:900px){
  .app{display:block}
  .app.hidden{display:none}
  .sidebar{position:static;width:auto;height:auto;padding:12px 12px 10px}
  .brand{margin:0 0 10px;display:flex;align-items:center;gap:10px;text-align:left}.logo{width:150px;margin:0}.brand small{margin:0}.wheat{display:none}
  .nav{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
  .nav button{white-space:nowrap;padding:8px 12px}
  .side-foot{display:none}
  .main{padding:16px 16px 32px}
  h1{font-size:23px}
}
</style>
</head>
<body>
<div id="passwordOverlay" class="password-overlay" aria-live="polite">
  <div class="password-modal">
    <div class="eyebrow">CIMMYT account</div>
    <h2>Sign in</h2>
    <form id="passwordForm" novalidate>
      <label class="login-label" for="usernameInput">User name</label>
      <input id="usernameInput" class="password-field" type="text" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
      <label class="login-label" for="passwordInput">Password</label>
      <input id="passwordInput" class="password-field" type="password" placeholder="Password" autocomplete="current-password">
      <div class="password-actions"><button type="submit" class="btn primary" id="signInBtn">Sign in</button></div>
      <div id="passwordError" class="password-error" role="alert"></div>
    </form>
  </div>
</div>
<div class="app hidden">
  <aside class="sidebar">

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

const money = (n) => { n = Number(n || 0); const a = Math.abs(n), sign = n < 0 ? "-" : ""; return sign + (a >= 1e6 ? "$" + (a / 1e6).toFixed(2) + "M" : a >= 1e4 ? "$" + (a / 1e3).toFixed(1) + "K" : "$" + a.toLocaleString("en-US", { maximumFractionDigits: 0 })); };

  const keyOf = (r) => periodMode === "Yearly" ? r.date.slice(0, 4) : `${r.date.slice(0, 4)} ${quarterOf(r.date)}`;
  const periods = uniq(scoped, keyOf), cs = uniq(scoped, (r) => r.country);
  const rows = periods.map((p) => { const a = scoped.filter((r) => keyOf(r) === p), cy = a.filter((r) => r.cycle != null).map((r) => r.cycle); const row = { p, pos: poCount(a), lines: a.length, usd: sum(a, (r) => r.usd), inv: sum(a, (r) => r.inv), open: a.filter((r) => r.stage === "PO open").length, late: a.filter(isLate).length, vendors: uniq(a, (r) => r.vendor).length, cyc: cy.length ? Math.round(median(cy)) : null }; row.avg = row.usd / (row.pos || 1); cs.forEach((c) => { row[c] = sum(a.filter((r) => r.country === c), (r) => r.usd); }); return row; });
  rows.forEach((r, i) => { r.chg = i && rows[i - 1].usd ? Math.round(100 * (r.usd - rows[i - 1].usd) / rows[i - 1].usd) : null; });
  const last = periods[periods.length - 1], lastRows = scoped.filter((r) => keyOf(r) === last), lastByCountry = tally(lastRows, (r) => r.country, (r) => r.usd), lastByCat = topN(tally(lastRows, (r) => r.cat, (r) => r.usd), 7);
  const cols = [{ label: "Period", get: (r) => r.p }, { label: "POs", num: true, get: (r) => r.pos }, { label: "Lines", num: true, get: (r) => r.lines }, { label: "Value USD (est.)", num: true, get: (r) => Math.round(r.usd), html: (r) => money(r.usd) },
    { label: "Change", num: true, get: (r) => r.chg, html: (r) => r.chg == null ? "–" : `<span class="pill ${r.chg >= 0 ? "green" : "orange"}">${r.chg >= 0 ? "+" : ""}${r.chg}%</span>` }, { label: "Average PO", num: true, get: (r) => Math.round(r.avg), html: (r) => money(r.avg) },
    { label: "Invoiced USD", num: true, get: (r) => Math.round(r.inv), html: (r) => money(r.inv) }, { label: "Invoiced %", num: true, get: (r) => r.usd ? Math.round(100 * r.inv / r.usd) : 0, html: (r) => pct(r.inv, r.usd) }, { label: "Open lines", num: true, get: (r) => r.open }, { label: "Past delivery", num: true, get: (r) => r.late },
    { label: "Vendors", num: true, get: (r) => r.vendors }, { label: "PO → invoice days", num: true, get: (r) => r.cyc, html: (r) => r.cyc ?? "–" }]
    .concat(cs.map((c) => ({ label: c, num: true, get: (r) => Math.round(r[c]), html: (r) => money(r[c]) })));
  const word = periodMode === "Yearly" ? "year" : "quarter";
  return `<div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:16px">
    <div class="seg" role="tablist" aria-label="Period">${["Yearly", "Quarterly"].map((m) => `<button role="tab" aria-selected="${periodMode === m}" class="${periodMode === m ? "on" : ""}" data-period="${m}">${m}</button>`).join("")}</div>
    <label style="display:grid;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Year<select id="periodYear">${["All"].concat(years).map((y) => `<option${periodYear === y ? " selected" : ""}>${y}</option>`).join("")}</select></label></div>
  ${!periods.length ? `<div class="loader"><div>No PO lines for these filters.</div></div>` : `
  <div class="grid">
    ${panel(`PO value by ${word}`, "USD estimate by creation date, stacked by country. Quarters follow the calendar year (Q1 = Jan–Mar).", chart(stacked(periods, cs.map((c) => [c, rows.map((r) => r[c]), COUNTRY_COLOR[c] || "#7b90a4"]), "PO value by period", true)))}
    ${panel(`Committed against invoiced by ${word}`, "USD", chart({ type: "bar", aria: "Committed and invoiced by period", data: { labels: periods, datasets: [{ label: "Committed (est.)", data: rows.map((r) => r.usd), backgroundColor: "#9fb3c2", borderRadius: 3 }, { label: "Invoiced", data: rows.map((r) => r.inv), backgroundColor: "#0c3554", borderRadius: 3 }] }, options: { scales: { y: moneyTick }, plugins: { legend: { labels: { boxWidth: 10 } }, tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${money(c.parsed.y)}` } } } } }))}
    ${panel(`Purchase orders by ${word}`, "Number of purchase orders created", chart({ type: "line", aria: "Purchase orders by period", data: { labels: periods, datasets: [{ label: "Purchase orders", data: rows.map((r) => r.pos), borderColor: "#0e7d8d", backgroundColor: "rgba(14,125,141,.12)", fill: true, tension: .25, pointRadius: 4 }] }, options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } } }))}
    ${panel(`${last}: share by country`, "Latest period in view", chart(Object.assign(pie(lastByCountry, lastByCountry.map((p) => COUNTRY_COLOR[p[0]] || "#7b90a4"), true), { aria: "Latest period by country" })))}
    ${panel(`${last}: share by category`, "Latest period in view", chart(Object.assign(pie(lastByCat, PALETTE, true), { aria: "Latest period by category" })))}
    ${panel(`Average PO value by ${word}`, "USD estimate per purchase order", chart(vbar(rows.map((r) => [r.p, r.avg]), "#0798d4", "Average PO value by period", true)))}
    ${panel(`${periodMode} summary`, "Rejected and cancelled lines are left out. Change compares each period with the one before.", tableBlock("periods", rows, cols, { search: false, per: 20, file: periodMode.toLowerCase() + "-summary.csv" }), "wide")}
  </div><p class="note">Only the dates loaded above are included. To compare full years, widen the "Created from" date and press Load data.</p>`}`;
}
function suppliersPage() {
  if (!PO.length) return needData();
  const d = filtered().filter(isLive);
  const group = (keyFn) => { const m = new Map(); d.forEach((r) => { const k = keyFn(r) || "Not set"; (m.get(k) || m.set(k, []).get(k)).push(r); }); return [...m.entries()].map(([k, a]) => ({ k, rows: a, pos: poCount(a), lines: a.length, usd: sum(a, (r) => r.usd), inv: sum(a, (r) => r.inv), late: a.filter(isLate).length, countries: uniq(a, (r) => r.country).join(", ") })); };
  const vendors = group((r) => r.vendor).sort((a, b) => b.usd - a.usd), cats = group((r) => r.cat).sort((a, b) => b.usd - a.usd), buyers = group((r) => r.buyer).sort((a, b) => b.usd - a.usd);
  const total = sum(d, (r) => r.usd), top5 = sum(vendors.slice(0, 5), (v) => v.usd);
  let run = 0; const pareto = vendors.slice(0, 20).map((v) => { run += v.usd; return Math.round(100 * run / (total || 1)); });
  const n80 = (() => { let s = 0, i = 0; while (i < vendors.length && s < 0.8 * total) s += vendors[i++].usd; return i; })();
  const gcols = (label) => [{ label, get: (r) => r.k, cls: "wrap" }, { label: "POs", num: true, get: (r) => r.pos }, { label: "Lines", num: true, get: (r) => r.lines }, { label: "Value USD (est.)", num: true, get: (r) => Math.round(r.usd), html: (r) => money(r.usd) }, { label: "Share", num: true, get: (r) => r.usd, html: (r) => pct(r.usd, total) },
    { label: "Average PO", num: true, get: (r) => Math.round(r.usd / (r.pos || 1)), html: (r) => money(r.usd / (r.pos || 1)) }, { label: "Invoiced %", num: true, get: (r) => r.usd ? Math.round(100 * r.inv / r.usd) : 0, html: (r) => pct(r.inv, r.usd) }, { label: "Past delivery", num: true, get: (r) => r.late, html: (r) => r.late ? `<span class="pill red">${r.late}</span>` : "0" }, { label: "Countries", get: (r) => r.countries }];
  const drill = (label) => (g) => openRowsDetail(poDetail(`${label}: ${g.k}`, g.rows));
  return `<div class="kpis">
    ${kpi("Vendors", fmtInt(vendors.length), "With a live PO line", "")}
    ${kpi("Top 5 vendor share", pct(top5, total), "Share of PO value: concentration check", top5 / (total || 1) > .6 ? "orange" : "")}
    ${kpi("Vendors for 80% of value", fmtInt(n80), `of ${fmtInt(vendors.length)} vendors`, "navy")}
    ${kpi("One-PO vendors", fmtInt(vendors.filter((v) => v.pos === 1).length), pct(vendors.filter((v) => v.pos === 1).length, vendors.length) + " of vendors used once", "")}
    ${kpi("Vendors with late lines", fmtInt(vendors.filter((v) => v.late).length), "At least one open line past delivery", "red")}
    ${kpi("Categories", fmtInt(cats.length), "Procurement categories used", "")}
  </div>
  <div class="grid">
    ${panel("Top 10 vendors by value", "USD estimate", chart(hbar(vendors.slice(0, 10).map((v) => [v.k, v.usd]), "#0e7d8d", "Top vendors by value")))}
    ${panel("Vendor concentration", "Cumulative share of PO value across the 20 largest vendors", chart({ type: "line", aria: "Cumulative share of value by vendor rank", data: { labels: pareto.map((_, i) => i + 1), datasets: [{ label: "Cumulative share", data: pareto, borderColor: "#0c3554", backgroundColor: "rgba(12,53,84,.08)", fill: true, tension: .2, pointRadius: 3 }] }, options: { plugins: { legend: { display: false }, tooltip: { callbacks: { title: (c) => "Top " + c[0].label + " vendors", label: (c) => ` ${c.parsed.y}% of PO value` } } }, scales: { y: { min: 0, max: 100, ticks: { callback: (v) => v + "%" } }, x: { title: { display: true, text: "Vendors, largest first" } } } } }))}
    ${panel("Value by category", "USD estimate, top 10", chart(hbar(cats.slice(0, 10).map((v) => [v.k, v.usd]), "#0798d4", "Value by category")))}
    ${panel("Value by procurement officer", "USD estimate", chart(Object.assign(pie(buyers.map((b) => [b.k, b.usd]), PALETTE, true), { aria: "Value by procurement officer" })))}
    ${panel("Vendor register", "Click a vendor to see its PO lines.", tableBlock("vendors", vendors, gcols("Vendor"), { sort: 3, dir: -1, onRow: drill("Vendor"), file: "vendors.csv" }), "wide")}
    ${panel("Category register", "Click a category to see its PO lines.", tableBlock("cats", cats, gcols("Category"), { sort: 3, dir: -1, onRow: drill("Category"), file: "categories.csv" }), "wide")}
    ${panel("Procurement officer workload", "Click a name to see their PO lines.", tableBlock("buyers", buyers, gcols("Procurement officer"), { sort: 3, dir: -1, search: false, onRow: drill("Officer"), file: "officers.csv" }), "wide")}
  </div>`;
}

/* ============================== Render and events ============================== */
const TITLES = {
  overview: ["Procurement Overview", "Purchase orders, value, stage and items needing attention"], orders: ["Purchase Orders", "Every PO line from D365: search, sort, export"],
  delivery: ["Delivery & Invoicing", "Late deliveries, what is due next and how fast orders are invoiced"],
  reqs: ["Requisitions", "Purchase requisition status, ageing and conversion to PO"], plan: ["Procurement Plan", "Plan against ICC with a stage timeline and deadline colours"],
  projects: ["Projects & ICC", "Spend, invoicing and open orders by project and cost centre"],
  periods: ["Yearly & Quarterly", "Compare procurement by year or by quarter"], suppliers: ["Suppliers & Categories", "Vendor concentration, categories and officer workload"]
};
function render() {
  details = []; pendingCharts = [];
  const overdue = PLAN.length ? evaluatePlan().filter((p) => p.status === "Overdue").length : 0;
  $("nav").innerHTML = TABS.map(([id, name, ic]) => `<button data-tab="${id}" class="${tab === id ? "active" : ""}" ${tab === id ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[ic]}</svg><span>${name}</span>${id === "plan" && overdue ? `<span class="count" title="Overdue plan items">${overdue}</span>` : ""}</button>`).join("");
  $("pageTitle").textContent = TITLES[tab][0]; $("pageSub").textContent = TITLES[tab][1];
  $("sideFoot").innerHTML = `Data: D365 SSRS reports<br>Today: ${showDate(TODAY)}`;
  const showFilters = true;
  $("filters").innerHTML = showFilters ? filterBar(tab === "reqs" ? ["country"] : tab === "plan" ? ["country", "project"] : null) : "";
  const prevTables = tables; tables = {};
  Object.keys(prevTables).forEach((k) => { if (k !== "detail") tables[k] = { sort: prevTables[k].sort, dir: prevTables[k].dir, page: prevTables[k].page, q: prevTables[k].q }; });
  $("content").innerHTML = { overview, orders: ordersPage, delivery: deliveryPage, reqs: reqsPage, plan: planPage, projects: projectsPage, periods: periodsPage, suppliers: suppliersPage }[tab]();
  Object.keys(tables).forEach((id) => { if (tables[id].rows) drawTable(id); else delete tables[id]; });
  mountCharts();
}
function go(t) { if (!TITLES[t]) t = "overview"; tab = t; if (location.hash.slice(1) !== t) history.replaceState(null, "", "#" + t); tables = {}; render(); window.scrollTo(0, 0); }

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-tab],[data-detail],[data-tsort],[data-tpage],[data-trow],[data-texport],[data-period],#clearFilters,#loadPrBtn,#planUpload,#planTemplate,#planClear,#planSample,#retryBtn,#rawCsvBtn");
  if (!el) return;
  if (el.dataset.tab) return go(el.dataset.tab);
  if (el.dataset.detail !== undefined) { const d = details[+el.dataset.detail]; if (d) openRowsDetail(d); return; }
  if (el.dataset.tsort) { const [id, i] = el.dataset.tsort.split(":"), t = tables[id]; if (t.sort === +i) t.dir = -t.dir; else { t.sort = +i; t.dir = 1; } t.page = 1; return drawTable(id); }
  if (el.dataset.tpage) { const [id, n] = el.dataset.tpage.split(":"); tables[id].page += +n; return drawTable(id); }
  if (el.dataset.trow) { const [id, i] = el.dataset.trow.split(":"), t = tables[id]; if (t.onRow) t.onRow(t.visible[+i]); return; }
  if (el.dataset.texport) { const t = tables[el.dataset.texport]; return exportCsv(t.file, tableRows(t), t.cols); }
  if (el.dataset.period) { periodMode = el.dataset.period; return render(); }
  if (el.id === "clearFilters") { Object.keys(filters).forEach((k) => (filters[k] = "All")); return render(); }
  if (el.id === "loadPrBtn") return loadPR();
  if (el.id === "retryBtn") return loadFromApi();
  if (el.id === "rawCsvBtn") return downloadBlob("purchase-orders-original-report.csv", new Blob([rawCsv], { type: "text/csv;charset=utf-8" }));
  if (el.id === "planUpload") return $("planInput").click();
  if (el.id === "planTemplate") return downloadTemplate();
  if (el.id === "planSample") return loadSamplePlan();
  if (el.id === "planClear") { if (confirm("Remove the uploaded plan from this browser?")) { PLAN = []; planSource = ""; store.set("plan", []); store.set("planSource", ""); render(); } }
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.trow) e.target.click(); });
document.addEventListener("change", (e) => {
  if (e.target.dataset.filter) { filters[e.target.dataset.filter] = e.target.value; Object.values(tables).forEach((t) => (t.page = 1)); render(); }
  if (e.target.id === "periodYear") { periodYear = e.target.value; render(); }
  if (e.target.dataset.prfilter) { prFilters[e.target.dataset.prfilter] = e.target.value; if (tables.reqs) tables.reqs.page = 1; render(); }
});
document.addEventListener("input", (e) => { const id = e.target.dataset.tsearch; if (id) { tables[id].q = e.target.value; tables[id].page = 1; drawTable(id); } });
$("loadBtn").onclick = loadFromApi;
$("planInput").onchange = (e) => { const f = e.target.files[0]; if (f) uploadPlan(f); e.target.value = ""; };
$("detailClose").onclick = () => $("detailDialog").close();
$("detailExport").onclick = () => currentDetail && currentDetail();
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (t !== tab && TITLES[t]) go(t); });

/* ============================== Sign-in and start ==============================
   The user signs in with their own CIMMYT Windows account. The API checks it against the
   report server and returns a session token. Only the token is kept, and only for this tab. */
const TOKEN_KEY = "cimmytProc.session";
function saveSession(token, expiresAt) { authToken = token; try { sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ token, expiresAt })); } catch { /* storage unavailable: the user signs in again after a reload */ } }
function clearSession() { authToken = ""; try { sessionStorage.removeItem(TOKEN_KEY); } catch { /* nothing stored */ } }
function restoreSession() { try { const v = JSON.parse(sessionStorage.getItem(TOKEN_KEY)); if (v && v.token && v.expiresAt > Date.now()) { authToken = v.token; return true; } } catch { /* no usable session */ } clearSession(); return false; }

let started = false;
function enterApp() {
  $("passwordOverlay").classList.add("hidden");
  document.querySelector(".app").classList.remove("hidden");
  if (started) { loadFromApi(); return; }
  started = true;
  // Default range: the last 3 months, kept short because the report server is slow on long ranges.
  const from = new Date(); from.setDate(1); from.setMonth(from.getMonth() - 3); // day 1 first, so a short month cannot overflow
  from.setDate(Math.min(new Date().getDate(), new Date(from.getFullYear(), from.getMonth() + 1, 0).getDate()));
  $("dFrom").value = iso(from);
  $("dTo").value = "";
  tab = TITLES[location.hash.slice(1)] ? location.hash.slice(1) : "overview";
  render();
  if (typeof Chart === "undefined" || typeof XLSX === "undefined" || typeof Papa === "undefined") { poLoading = false; loadError = "A chart or Excel library could not be loaded from the CDN. Check the internet connection and reload."; render(); return; }
  loadFromApi();
}
function showSignIn(message) {
  clearSession();
  prRun++; PO = []; PR = []; rawCsv = ""; prState = "idle"; poLoading = true; // drop the loaded data with the session
  if ($("detailDialog").open) $("detailDialog").close();
  document.querySelector(".app").classList.add("hidden");
  $("passwordOverlay").classList.remove("hidden");
  $("passwordError").textContent = message || "";
  $("passwordInput").value = "";
  ($("usernameInput").value ? $("passwordInput") : $("usernameInput")).focus();
}
async function signIn() {
  const username = $("usernameInput").value.trim(), password = $("passwordInput").value, btn = $("signInBtn"), err = $("passwordError");
  if (!username || !password) { err.textContent = "Enter your user name and password."; (username ? $("passwordInput") : $("usernameInput")).focus(); return; }
  btn.disabled = true; btn.textContent = "Signing in…"; err.textContent = "";
  try {
    let res;
    try { res = await fetch(API_BASE + "/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username, password }) }); }
    catch { throw new Error(UNREACHABLE); }
    let data = {}; try { data = await res.json(); } catch { /* not JSON */ }
    if (!res.ok || !data.token) throw new Error(data.message || `Sign-in failed (HTTP ${res.status}).`);
    $("passwordInput").value = "";
    saveSession(data.token, data.expiresAt);
    enterApp();
  } catch (e) { err.textContent = e.message; $("passwordInput").select(); }
  btn.disabled = false; btn.textContent = "Sign in";
}
$("passwordForm").addEventListener("submit", (event) => { event.preventDefault(); signIn(); });
$("signOutBtn").onclick = () => {
  const token = authToken;
  showSignIn("");
  if (token) fetch(API_BASE + "/api/logout", { method: "POST", headers: { Authorization: "Bearer " + token } }).catch(() => { /* the session also expires by itself */ });
};
if (restoreSession()) enterApp();
</script>
